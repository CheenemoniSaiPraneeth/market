<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>BiotechIntelligence — Modality Monitor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:        #080c12;
    --surface:   #0f1520;
    --surface2:  #161e2e;
    --border:    rgba(255,255,255,0.07);
    --text:      #e8edf5;
    --muted:     #6b7a94;
    --dim:       #3d4a60;
  }
  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* ── HEADER ── */
  header {
    position: sticky; top:0; z-index:100;
    height: 56px;
    background: rgba(8,12,18,0.95);
    backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center;
    padding: 0 28px; gap: 20px;
  }
  .logo {
    font-family: 'Space Mono', monospace;
    font-size: 13px; font-weight: 700;
    letter-spacing: 0.06em;
    white-space: nowrap;
  }
  .logo em { font-style: normal; color: #e879f9; }
  .logo span { color: var(--muted); font-weight: 400; margin-left: 10px; font-size:11px; letter-spacing:0.12em; }

  .header-right {
    margin-left: auto;
    display: flex; align-items: center; gap: 18px;
    font-family: 'Space Mono', monospace;
    font-size: 11px; color: var(--muted);
  }
  .stat-pill {
    display: flex; align-items: center; gap: 7px;
  }
  .stat-pill strong { color: var(--text); font-size: 13px; }
  .live-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: #34d399;
    box-shadow: 0 0 8px #34d39966;
    animation: pulse 2s infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

  /* ── NAV TABS ── */
  nav {
    border-bottom: 1px solid var(--border);
    padding: 0 28px;
    display: flex; gap: 0;
    background: var(--bg);
  }
  .tab {
    padding: 14px 20px;
    font-size: 13px; font-weight: 500;
    color: var(--muted);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: all .2s;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    font-size: 11px;
  }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--text); border-bottom-color: #e879f9; }

  /* ── MAIN CONTENT ── */
  main { padding: 32px 28px; max-width: 1400px; margin: 0 auto; }

  /* ── SECTION TITLE ── */
  .section-title {
    font-family: 'Space Mono', monospace;
    font-size: 10px; letter-spacing: 0.14em;
    color: var(--muted); text-transform: uppercase;
    margin-bottom: 18px;
  }

  /* ── MODALITY CARDS GRID ── */
  .cards-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(310px, 1fr));
    gap: 16px;
    margin-bottom: 36px;
  }

  .modality-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 22px 24px 20px;
    cursor: pointer;
    transition: border-color .2s, transform .15s;
    position: relative; overflow: hidden;
  }
  .modality-card::before {
    content:'';
    position:absolute; top:0; left:0; right:0; height:2px;
    background: var(--card-color, #e879f9);
    opacity: 0.8;
  }
  .modality-card:hover {
    border-color: rgba(255,255,255,0.14);
    transform: translateY(-2px);
  }
  .modality-card.active { border-color: var(--card-color, #e879f9); }

  .card-top {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 14px;
  }
  .card-icon {
    font-size: 16px;
    color: var(--card-color, #e879f9);
  }
  .card-name {
    font-weight: 600; font-size: 15px;
  }
  .card-date {
    margin-left: auto;
    font-size: 11px; color: var(--muted);
    font-family: 'Space Mono', monospace;
  }
  .card-count {
    font-family: 'Space Mono', monospace;
    font-size: 42px; font-weight: 700;
    color: var(--card-color, #e879f9);
    line-height: 1;
    margin-bottom: 6px;
  }
  .card-label {
    font-size: 11px; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.1em;
    margin-bottom: 14px;
  }
  .card-tags {
    display: flex; gap: 6px; flex-wrap: wrap;
  }
  .tag {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 3px 8px;
    font-family: 'Space Mono', monospace;
    font-size: 10px; color: var(--muted);
  }

  /* ── SCHEDULE TABLE ── */
  .schedule-grid {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 36px;
  }
  .schedule-row {
    display: grid;
    grid-template-columns: 110px 120px 1fr 1fr;
    gap: 0;
    padding: 12px 20px;
    border-bottom: 1px solid var(--border);
    align-items: center;
    font-size: 13px;
  }
  .schedule-row:last-child { border-bottom: none; }
  .schedule-row.today { background: rgba(255,255,255,0.03); }
  .schedule-row.header {
    font-family: 'Space Mono', monospace;
    font-size: 10px; letter-spacing: 0.1em;
    color: var(--muted); text-transform: uppercase;
    padding: 10px 20px;
    background: var(--surface2);
    border-bottom: 1px solid var(--border);
  }
  .today-badge {
    background: #e879f920;
    color: #e879f9;
    border: 1px solid #e879f940;
    border-radius: 4px;
    padding: 2px 7px;
    font-size: 10px;
    font-family: 'Space Mono', monospace;
    margin-left: 8px;
  }
  .keyword-pill {
    display: inline-block;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 3px 9px;
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--muted);
  }

  /* ── STATUS BAR ── */
  .status-bar {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 20px;
    display: flex; align-items: center; gap: 16px;
    margin-bottom: 36px;
    font-size: 13px;
  }
  .status-stage {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 4px;
    background: var(--surface2);
    border: 1px solid var(--border);
  }
  .status-stage.running { color: #fbbf24; border-color: #fbbf2440; background: #fbbf2410; }
  .status-stage.complete { color: #34d399; border-color: #34d39940; background: #34d39910; }
  .status-stage.idle { color: var(--muted); }

  /* ── GRAPH BUTTON ── */
  .btn-graph {
    display: inline-flex; align-items: center; gap: 8px;
    background: linear-gradient(135deg, #e879f920, #4f9eff20);
    border: 1px solid #e879f940;
    color: #e879f9;
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 13px; font-weight: 500;
    cursor: pointer;
    text-decoration: none;
    transition: all .2s;
  }
  .btn-graph:hover {
    background: linear-gradient(135deg, #e879f930, #4f9eff30);
    border-color: #e879f970;
  }

  /* ── PANELS ── */
  .panel { display: none; }
  .panel.active { display: block; }

  /* ── HISTORY TABLE ── */
  .history-table {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }
  .history-row {
    display: grid;
    grid-template-columns: 120px 1fr 80px;
    padding: 11px 20px;
    border-bottom: 1px solid var(--border);
    font-size: 13px; align-items: center;
  }
  .history-row:last-child { border-bottom: none; }
  .history-row.header {
    font-family: 'Space Mono', monospace;
    font-size: 10px; letter-spacing: 0.1em;
    color: var(--muted); text-transform: uppercase;
    background: var(--surface2);
    padding: 10px 20px;
  }
  .history-count {
    font-family: 'Space Mono', monospace;
    font-weight: 700; color: #e879f9;
  }

  /* loading */
  .loading { color: var(--muted); font-size: 13px; padding: 40px 0; text-align: center; }
</style>
</head>
<body>

<!-- ── HEADER ── -->
<header>
  <div class="logo">
    <em>Biotech</em>Intelligence
    <span>MODALITY MONITOR</span>
  </div>
  <div class="header-right">
    <div class="stat-pill">
      <div class="live-dot"></div>
      <span id="total-articles"><strong>—</strong> articles</span>
    </div>
    <div class="stat-pill">
      last run <strong id="last-run">—</strong>
    </div>
  </div>
</header>

<!-- ── NAV ── -->
<nav>
  <div class="tab active" onclick="showPanel('dashboard')">Dashboard</div>
  <div class="tab" onclick="showPanel('schedule')">Schedule</div>
  <div class="tab" onclick="showPanel('history')">Archive</div>
</nav>

<!-- ── MAIN ── -->
<main>

  <!-- STATUS -->
  <div class="status-bar" id="status-bar">
    <span id="status-stage" class="status-stage idle">idle</span>
    <span id="status-text" style="color:var(--muted)">No pipeline run detected yet</span>
    <a id="btn-graph-view" href="/graph" class="btn-graph" style="margin-left:auto" target="_blank">
      ◈ Open Graph View
    </a>
  </div>

  <!-- DASHBOARD PANEL -->
  <div id="panel-dashboard" class="panel active">
    <div class="section-title">Modality Index</div>
    <div class="cards-grid" id="cards-grid">
      <div class="loading">Loading modality data...</div>
    </div>
  </div>

  <!-- SCHEDULE PANEL -->
  <div id="panel-schedule" class="panel">
    <div class="section-title">7-Day Rotation Schedule</div>
    <div class="schedule-grid">
      <div class="schedule-row header">
        <div>Day</div>
        <div>Date</div>
        <div>Modality</div>
        <div>Search Keyword</div>
      </div>
      <div id="schedule-body" class="loading">Loading...</div>
    </div>
  </div>

  <!-- HISTORY PANEL -->
  <div id="panel-history" class="panel">
    <div class="section-title">Scrape History</div>
    <div class="history-table">
      <div class="history-row header">
        <div>Date</div>
        <div>Modality</div>
        <div>Items</div>
      </div>
      <div id="history-body" class="loading">Loading...</div>
    </div>
  </div>

</main>

<script>
// ── PANEL SWITCHING ────────────────────────────────────────────────────────
function showPanel(name) {
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('panel-' + name).classList.add('active');
  event.target.classList.add('active');

  if (name === 'schedule' && !window._scheduleLoaded) loadSchedule();
  if (name === 'history'  && !window._historyLoaded)  loadHistory();
}

// ── LOAD STATUS ───────────────────────────────────────────────────────────
async function loadStatus() {
  try {
    const r = await fetch('/api/status');
    const d = await r.json();

    const stageEl = document.getElementById('status-stage');
    const textEl  = document.getElementById('status-text');
    const lastEl  = document.getElementById('last-run');

    const stage = d.stage || 'idle';
    stageEl.textContent = stage;
    stageEl.className   = 'status-stage ' + (
      stage === 'complete' ? 'complete' :
      stage === 'idle' || stage === 'done_no_articles' ? 'idle' : 'running'
    );

    if (d.last_updated) lastEl.textContent = d.last_updated;

    // Update the graph button to point to the current modality's graph
    const btnGraph = document.getElementById('btn-graph-view');
    if (btnGraph && d.modality && d.modality !== '—') {
      btnGraph.href = `/graph?modality=${encodeURIComponent(d.modality)}`;
    }

    textEl.textContent = d.modality && d.modality !== '—'
      ? `${d.modality}  ·  keyword: "${d.keyword}"${d.links_processed ? '  ·  ' + d.links_processed + ' links processed' : ''}`
      : 'No pipeline run detected yet';

  } catch(e) { /* ignore */ }
}

// ── LOAD CARDS ────────────────────────────────────────────────────────────
async function loadCards() {
  try {
    const r    = await fetch('/api/counts');
    const data = await r.json();

    let total = data.reduce((s, m) => s + m.count, 0);
    document.getElementById('total-articles').innerHTML = `<strong>${total}</strong> articles`;

    const grid = document.getElementById('cards-grid');
    grid.innerHTML = '';

    data.forEach(m => {
      const card = document.createElement('div');
      card.className = 'modality-card';
      card.style.setProperty('--card-color', m.color);

      const scrapeDate = m.last_scraped !== 'Never'
        ? 'Last scraped: ' + m.last_scraped
        : 'Not yet scraped';

      const hasData  = m.last_scraped !== 'Never';
      const graphUrl = `/graph?modality=${encodeURIComponent(m.label)}`;

      card.innerHTML = `
        <div class="card-top">
          <div class="card-icon">${m.icon}</div>
          <div class="card-name">${m.label}</div>
          <div class="card-date">${scrapeDate}</div>
        </div>
        <div class="card-count">${m.count || '—'}</div>
        <div class="card-label">Articles Indexed</div>
        <div class="card-tags">
          ${m.tags.map(t => `<span class="tag">${t}</span>`).join('')}
        </div>
        ${hasData ? `
        <div style="margin-top:14px">
          <a href="${graphUrl}" target="_blank"
             onclick="event.stopPropagation()"
             style="display:inline-flex;align-items:center;gap:6px;
                    background:${m.color}15;border:1px solid ${m.color}40;
                    color:${m.color};padding:6px 14px;border-radius:6px;
                    font-size:12px;font-weight:500;text-decoration:none;
                    transition:all .2s;"
             onmouseover="this.style.background='${m.color}25'"
             onmouseout="this.style.background='${m.color}15'">
            ◈ View Knowledge Graph
          </a>
        </div>` : `
        <div style="margin-top:14px;font-size:12px;color:var(--dim)">
          No graph yet — run pipeline first
        </div>`}
      `;
      if (hasData) {
        card.style.cursor = 'pointer';
        card.addEventListener('click', () => window.open(graphUrl, '_blank'));
      }
      grid.appendChild(card);
    });
  } catch(e) {
    document.getElementById('cards-grid').innerHTML = '<div class="loading">Failed to load data</div>';
  }
}

// ── LOAD SCHEDULE ─────────────────────────────────────────────────────────
async function loadSchedule() {
  window._scheduleLoaded = true;
  try {
    const r    = await fetch('/api/schedule');
    const data = await r.json();

    const body = document.getElementById('schedule-body');
    body.innerHTML = '';

    data.forEach(d => {
      const row = document.createElement('div');
      row.className = 'schedule-row' + (d.is_today ? ' today' : '');
      row.innerHTML = `
        <div style="font-weight:500">${d.day_name}${d.is_today ? '<span class="today-badge">TODAY</span>' : ''}</div>
        <div style="color:var(--muted);font-family:'Space Mono',monospace;font-size:12px">${d.date}</div>
        <div style="display:flex;align-items:center;gap:8px">
          <span style="color:${d.color}">${d.icon}</span>
          <span>${d.modality}</span>
        </div>
        <div><span class="keyword-pill">${d.keyword}</span></div>
      `;
      body.appendChild(row);
    });
  } catch(e) {
    document.getElementById('schedule-body').textContent = 'Failed to load';
  }
}

// ── LOAD HISTORY ──────────────────────────────────────────────────────────
async function loadHistory() {
  window._historyLoaded = true;
  try {
    const r    = await fetch('/api/history');
    const data = await r.json();

    const body = document.getElementById('history-body');
    body.innerHTML = '';

    if (!data.summary || data.summary.length === 0) {
      body.innerHTML = '<div class="history-row" style="color:var(--muted)">No history yet. Run main.py to start.</div>';
      return;
    }

    data.summary.forEach(item => {
      const row = document.createElement('div');
      row.className = 'history-row';
      row.innerHTML = `
        <div style="font-family:'Space Mono',monospace;font-size:12px;color:var(--muted)">${item.date}</div>
        <div>${item.modality}</div>
        <div class="history-count">${item.count}</div>
      `;
      body.appendChild(row);
    });
  } catch(e) {
    document.getElementById('history-body').textContent = 'Failed to load';
  }
}

// ── INIT ──────────────────────────────────────────────────────────────────
loadStatus();
loadCards();
setInterval(loadStatus, 15000);  // refresh status every 15s
setInterval(loadCards,  60000);  // refresh counts every 60s
</script>
</body>
</html>
